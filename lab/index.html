const N=lessons.length, key="dsa-motion-lab-v3";
let saved;try{saved=JSON.parse(localStorage.getItem(key))||{}}catch{saved={}}
const store={completed:Array.isArray(saved.completed)?saved.completed:[],bookmarks:Array.isArray(saved.bookmarks)?saved.bookmarks:[],recent:Array.isArray(saved.recent)?saved.recent:[],reduced:!!saved.reduced};
let current=-1,view="home",tab="real",data=[],trace=[],position=-1,codePosition=-1,playing=false,timer=0,mode="step",speed=1,operations=0,redo=[],lastMessage="",quizLocked=false,resetConfirm=false;
const reducedMedia=matchMedia("(prefers-reduced-motion: reduce)");
function persist(){try{localStorage.setItem(key,JSON.stringify(store))}catch{notify("এই browser-এ progress save করা যাচ্ছে না।")}}
function notify(s){const el=$("toast");el.textContent=s;el.classList.remove("hidden");clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.add("hidden"),3600)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stop(){playing=false;clearTimeout(timer);timer=0;updatePlayLabels()}
function updatePlayLabels(){for(const id of ["stepPlay","codeRun"]){const el=$(id);if(el)el.textContent=playing&&((id==="stepPlay"&&mode==="step")||(id==="codeRun"&&mode==="code"))?"Ⅱ Pause":id==="stepPlay"?"▶ Play":"▶ Run Animation"}}
function closeDrawer(){$("sidebar").classList.remove("open");$("backdrop").classList.remove("show");$("menuBtn").setAttribute("aria-expanded","false")}
function progress(){const count=store.completed.filter(i=>Number.isInteger(i)&&i>=0&&i<N).length;$("sideProgress").textContent=`${count} / ${N} modules completed`;$("headerProgress").textContent=`${count}/${N}`;$("sideFill").style.width=(count/N*100)+"%"}
function nav(){const items=[["home","⌂","Dashboard"],["topics","▦","All Topics"],["progress","◉","Learning Progress"],["practice","✎","Practice Zone"],["code","⌘","Code Playground"],["about","✦","About Project"]];
$("mainNav").innerHTML=items.map(([id,icon,label])=>`<button type="button" class="nav-button ${view===id?"active":""}" data-view="${id}"><span class="num">${icon}</span>${label}</button>`).join("");
$("topicNav").innerHTML=lessons.map((l,i)=>`<button type="button" class="nav-button ${view==="lesson"&&current===i?"active":""}" data-topic="${i}" title="${esc(l.n)}"><span class="num">${String(i+1).padStart(2,"0")}</span><span>${esc(l.n)}<br><span style="font-weight:400;opacity:.73">${esc(l.sub)}</span></span>${store.bookmarks.includes(i)?'<span class="star" aria-label="Bookmarked">★</span>':""}</button>`).join("");filterNav();progress()}
function filterNav(){const q=$("globalSearch").value.trim().toLocaleLowerCase();$("topicNav").querySelectorAll("[data-topic]").forEach((el)=>{const l=lessons[Number(el.dataset.topic)];el.classList.toggle("hidden",!(l.n+" "+l.sub+" "+l.intro+" "+(Number(el.dataset.topic)+1)).toLocaleLowerCase().includes(q))})}
function openView(v){stop();closeDrawer();view=v;nav();render();window.scrollTo({top:0,behavior:store.reduced||reducedMedia.matches?"instant":"smooth"})}
function openLesson(i,targetTab="real"){if(i<0||i>=N)return;stop();current=i;view="lesson";tab=targetTab;data=Array.isArray(lessons[i].initial)?[...lessons[i].initial]:lessons[i].initial;trace=[];position=-1;codePosition=-1;operations=0;redo=[];lastMessage="একটি operation বেছে নিন।";quizLocked=false;store.recent=[i,...store.recent.filter(x=>x!==i)].slice(0,4);persist();nav();render();closeDrawer();window.scrollTo({top:0,behavior:store.reduced||reducedMedia.matches?"instant":"smooth"})}
function hero(){return `<section class="hero canva-banner"><div><div class="eyebrow">KAWSER TECH TEAM · INTERACTIVE PROGRAMMING LAB</div><h1 data-template-id="hero-title" class="canva-text">Master Data Structures &amp; Algorithms</h1><p data-template-id="hero-subtitle" class="canva-text">দেখে শেখো, নিজে করো, Programming-এ দক্ষ হও!</p><button type="button" class="btn primary" data-continue>Continue Learning →</button><div class="small muted" style="margin-top:14px">Learn by Watching. Understand by Doing.</div></div><div class="cube-row" aria-hidden="true">${["D","S","A","++"].map((x,i)=>`<div class="cube" style="--i:${i}">${x}</div>`).join("")}</div></section>`}
function card(i){const l=lessons[i];return `<article class="topic-card"><div class="row between"><span class="badge">${esc(l.icon)}</span><span class="pill">${store.completed.includes(i)?"✓ Completed":`MODULE ${String(i+1).padStart(2,"0")}`}</span></div><h3>${esc(l.n)}</h3><p>${esc(l.sub)}</p><button type="button" class="btn" data-topic="${i}">Explore lesson →</button></article>`}
function home(){const count=store.completed.length;return `${hero()}<div class="stats"><div class="panel stat"><strong>12</strong><span>Learning modules</span></div><div class="panel stat"><strong>${count}</strong><span>Completed topics</span></div><div class="panel stat"><strong>${Math.round(count/N*100)}%</strong><span>Learning progress</span></div></div><section class="panel"><div class="row between"><strong>Your learning journey</strong><span class="small muted">${count} of 12 complete</span></div><div class="progress-track"><div class="progress-fill" style="width:${count/N*100}%"></div></div></section>${store.recent.length?`<h2 class="section-title">Recently visited</h2><div class="row">${store.recent.map(i=>`<button class="chipbtn" type="button" data-topic="${i}">${esc(lessons[i].n)} ↗</button>`).join("")}</div>`:""}<h2 class="section-title">Explore the lab</h2><div class="topic-grid">${lessons.map((_,i)=>card(i)).join("")}</div>`}
function overview(){const l=lessons[current];return `<section class="lesson-top"><span class="eyebrow">MODULE ${String(current+1).padStart(2,"0")} / 12 · ${esc(l.sub)}</span><h1>${esc(l.n)}</h1><p>${esc(l.intro)}</p><div class="row"><span class="pill">Beginner friendly</span><span class="pill">≈ ${current===6||current===7?22:15} min</span><button type="button" class="chipbtn" data-bookmark>${store.bookmarks.includes(current)?"★ Bookmarked":"☆ Bookmark"}</button><button type="button" class="chipbtn" data-complete>${store.completed.includes(current)?"✓ Completed · Undo":"✓ Mark complete"}</button></div></section>`}
const tabs=[["real","◈ Real-life Animation"],["step","▷ Step-by-step Animation"],["interactive","◉ Interactive Visualizer"],["code","⌘ C++ Code Animation"]];

function visual(values,active=[],type="",kind=lessons[current].kind,meta={}){if(typeof values==="string")values=[...values];if(!values.length)return `<div class="muted small">এখন খালি · কোনো element নেই।</div>`;

if(k==="queue"){if(action==="enqueue"){const v=name();if(a.length>=8)throw Error("Queue overflow: ৮ জনের জায়গা পূর্ণ।");a.push(v);snapshot(a,`${v} REAR-এ ENQUEUE হলেন।`,[a.length-1],"found","নতুন যাত্রী লাইনের শেষে দাঁড়ান।",`REAR ${a.length-1}`,0,1,5)}else if(action==="dequeue"){if(!a.length)throw Error("Queue underflow: কোনো যাত্রী নেই।");const v=a.shift();snapshot(a,`${v} FRONT থেকে টিকিট পেয়ে বের হলেন।`,[0],"found","আগে আসা যাত্রী আগে সেবা পান।","FRONT advanced",0,1,7)}else{if(!a.length)throw Error("Queue খালি।");snapshot(a,`FRONT-এ ${a[0]} আছেন।`,[0],"found","PEEK queue বদলায় না।","O(1)",0,0,6)}}
if(k==="string"){const v=name(),b=(get("Other")||"").slice(0,30);if([...v].length>24)throw Error("Demo label সর্বোচ্চ ২৪ character রাখুন।");data=v;const chars=[...v];if(action==="length"){chars.forEach((c,i)=>snapshot(v,`Index ${i}: '${c}' পড়লাম।`,[i],"active","প্রতিটি character গণনা করছি।",`Count ${i+1}`,0,0,5));snapshot(v,`Length = ${chars.length}।`,[],"found","শেষ index থেকে length এক বেশি।",`length ${chars.length}`,0,0,5)}
if(action==="character"){const i=integer("Index","Index");if(i<0||i>=chars.length)throw Error("Character index 0 থেকে length−1 দিন।");snapshot(v,`Index ${i}-এর character '${chars[i]}'।`,[i],"found","Index দিয়ে সরাসরি character পাওয়া যায়।",`char '${chars[i]}'`,0,0,5)}

if(action==="reverse"){for(let i=0;i<Math.floor(chars.length/2);i++){[chars[i],chars[chars.length-1-i]]=[chars[chars.length-1-i],chars[i]];snapshot(chars.join(""),`Index ${i} ও ${chars.length-1-i} swap।`,[i,chars.length-1-i],"active","দুই প্রান্ত থেকে character বদলাই।","Reverse",0,1,6)}if(!trace.length)snapshot(v,"এক character-এর reverse একই।",[],"found","পরিবর্তনের দরকার নেই।","Done",0,0,6)}
if(action==="search"){if(!b)throw Error("Search text লিখুন।");let found=-1;for(let i=0;i<=v.length-b.length;i++){const match=v.slice(i,i+b.length)===b;snapshot(v,`Index ${i} থেকে '${b}' ${match?"মিলেছে।":"মেলেনি।"}`,[i],match?"found":"active","প্রতিটি সম্ভাব্য starting index দেখি।",`Checked ${i+1}`,1,0,5);if(match){found=i;break}}if(found<0)snapshot(v,"Substring পাওয়া যায়নি।",[],"active","সব সম্ভাব্য শুরু পরীক্ষা হয়েছে।","Not found",0,0,6)}}
if(!trace.length)throw Error("এই operation-এর কোনো ধাপ তৈরি হয়নি।");

function sorting(a,alg){const push=(m,ids=[],cmp=0,ch=0,info="",line)=>snapshot(a,m,ids,ch?"found":"active",alg==="merge"?"Sorted halves একত্র করছি।":alg==="counting"?"Frequency দিয়ে output তৈরি করছি।":alg==="radix"?"Digit-এর bucket অনুযায়ী stable order রাখছি।":"Value-এর ক্রম ঠিক করার জন্য।",info,cmp,ch,line);
if(alg==="bubble"){for(let i=0;i<a.length;i++)for(let j=0;j<a.length-1-i;j++){push(`${a[j]} বনাম ${a[j+1]} compare।`,[j,j+1],1,0,"Adjacent values",6);if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];push("ক্রম ভুল: দুটি value swap।",[j,j+1],0,1,"Largest moves right",7)}}}
if(alg==="selection"){for(let i=0;i<a.length;i++){let min=i;for(let j=i+1;j<a.length;j++){push(`Minimum ${a[min]} বনাম ${a[j]}।`,[min,j],1,0,`Selected index ${min}`,6);if(a[j]<a[min])min=j}if(min!==i){[a[i],a[min]]=[a[min],a[i]];push(`Minimum ${a[i]} index ${i}-এ বসেছে।`,[i,min],0,1,"Sorted prefix grows",7)}}}
if(alg==="insertion"){for(let i=1;i<a.length;i++){let j=i;while(j>0){push(`Key ${a[j]} বনাম আগের ${a[j-1]}।`,[j-1,j],1,0,"Sorted prefix",6);if(a[j]>=a[j-1])break;[a[j-1],a[j]]=[a[j],a[j-1]];push("Key বামে; বড় value ডানে shift।",[j-1,j],0,1,"Insert in sorted prefix",7);j--}}}
if(alg==="merge"){function divide(lo,hi,depth){if(hi-lo<=1)return;const mid=Math.floor((lo+hi)/2);push(`Recursion level ${depth}: [${lo}..${mid-1}] | [${mid}..${hi-1}] split।`,Array.from({length:hi-lo},(_,i)=>lo+i),0,0,`Tree depth ${depth} · left ${lo}–${mid-1} · right ${mid}–${hi-1}`,6);divide(lo,mid,depth+1);divide(mid,hi,depth+1);const left=a.slice(lo,mid),right=a.slice(mid,hi);let i=0,j=0,k=lo;while(i<left.length&&j<right.length){push(`${left[i]} বনাম ${right[j]} compare।`,[k],1,0,`Merge [${lo}..${hi-1}]`,7);a[k++]=left[i]<=right[j]?left[i++]:right[j++];push(`ছোট value index ${k-1}-এ merge।`,[k-1],0,1,`Merge [${lo}..${hi-1}]`,7)}while(i<left.length){a[k++]=left[i++];push(`Left-এর বাকি value index ${k-1}-এ।`,[k-1],0,1,"Left remainder",7)}while(j<right.length){a[k++]=right[j++];push(`Right-এর বাকি value index ${k-1}-এ।`,[k-1],0,1,"Right remainder",7)}}divide(0,a.length,0)}
if(alg==="counting"){if(a.some(v=>v<0||v>99))throw Error("Counting Sort-এর জন্য 0–99 value লাগবে; অন্য algorithm বেছে নিন।");const f=Array(100).fill(0);for(let i=0;i<a.length;i++){f[a[i]]++;push(`${a[i]}-এর frequency এখন ${f[a[i]]}।`,[i],1,0,`Frequency: ${f.map((v,j)=>v?j+":"+v:"").filter(Boolean).join(" · ")}`,6)}let k=0;for(let v=0;v<f.length;v++)for(let count=0;count<f[v];count++){a[k++]=v;push(`${v} result-এর index ${k-1}-এ।`,[k-1],0,1,`Frequency ${v} → ${f[v]}`,7)}}
if(alg==="radix"){if(a.some(v=>v<0||v>999))throw Error("Radix Sort-এর জন্য 0–999 value লাগবে।");const max=Math.max(...a,0);for(let place=1;Math.floor(max/place)>0;place*=10){const buckets=Array.from({length:10},()=>[]);a.forEach((v,i)=>{const digit=Math.floor(v/place)%10;buckets[digit].push(v);push(`${v} → digit ${digit} bucket।`,[i],1,0,`Place ${place}: ${buckets.map((b,j)=>b.length?j+"=["+b.join(",")+"]":"").filter(Boolean).join(" ")}`,6)});let k=0;for(const bucket of buckets)for(const v of bucket){a[k++]=v;push(`Bucket থেকে ${v} ফিরল।`,[k-1],0,1,`Stable pass · digit place ${place}`,7)}}}
push("Sorting শেষ: ascending order প্রস্তুত।",a.map((_,i)=>i),0,0,"Sorted result",8);
}
function currentTrace(){return trace[position]||null}
function changePosition(next){if(!trace.length){notify("আগে একটি operation প্রস্তুত করুন।");return}position=Math.max(-1,Math.min(trace.length-1,next));lastMessage=currentTrace()?.message||"প্রথম ধাপের আগে।";updateStep();updateLab();if(tab==="real"&&$("realFrame"))$("realFrame").innerHTML=frame(currentTrace(),true)}
function updateStep(){if(!$("stepFrame"))return;const t=currentTrace();$("stepFrame").innerHTML=frame(t,true);$("stepCount").textContent=`Step ${position+1} / ${trace.length}`;const elapsed=trace.slice(0,position+1);$("stepStats").textContent=`Comparisons ${elapsed.reduce((n,x)=>n+x.compare,0)} · Changes ${elapsed.reduce((n,x)=>n+x.change,0)}`;const slider=$("stepTimeline");slider.max=String(Math.max(0,trace.length));slider.value=String(position+1);$("previousState").textContent=position>=0?`Previous state: ${JSON.stringify(position?trace[position-1].state:(Array.isArray(data)?data: [...data]))}  →  Updated state: ${JSON.stringify(t.state)}`:"Previous state: —  →  Updated state: —";$("stepHint").textContent=trace.length?"কমলা = active · সবুজ = completed · timeline টেনে আগের বা পরের ধাপে যান।":"Operation অথবা algorithm বেছে Prepare চাপুন।"}
function updateLab(){if(!$("labFrame"))return;$("labFrame").innerHTML=frame(currentTrace(),true);$("labOps").textContent=`Operations: ${operations}`;$("labStatus").textContent=lastMessage}
function resetTrace(resetData=false){stop();trace=[];position=-1;codePosition=-1;if(resetData){data=Array.isArray(lessons[current].initial)?[...lessons[current].initial]:lessons[current].initial;operations=0;redo=[]}lastMessage=resetData?"শুরুর data ফিরে এসেছে।":"Animation শুরুতে ফিরেছে।";updateStep();updateLab();updateCode();if($("realFrame"))$("realFrame").innerHTML=frame(null,true)}
function codeSteps(){const l=lessons[current];const base=Array.isArray(data)?[...data]:data;if(!trace.length){trace=[];snapshot(base,"C++ variable ও data structure initialize হলো।",[],"active","Reference declaration-এর state দেখানো হচ্ছে।","Initialization",0,0,Math.min(4,l.code.length-1));if(["basic","advanced"].includes(l.kind))sorting([...base],l.kind==="advanced"?"merge":"bubble");else if(l.kind==="search"){let i=0;for(const value of base){snapshot(base,`Index ${i}-এর value ${value} দেখা হলো।`,[i++],"active","Predefined example-এর traversal।","Reference trace",1,0,l.line)}}else if(l.kind==="address"){const a=Array.from({length:6},(_,i)=>1000+i*4);snapshot(a,"1000 + (3 − 0) × 4 = 1012।",[3],"found","Base + offset × size।","address = 1012",0,0,5)}else if(l.kind==="stack"||l.kind==="queue"||l.kind==="linked"||l.kind==="array"||l.kind==="string"){(Array.isArray(base)?base:[...base]).forEach((v,i)=>snapshot(base,`Index / Node ${i}: ${v}।`,[i],"found","Reference example-এর value দেখা হচ্ছে।",`i = ${i}`,1,0,l.line))}snapshot(trace.at(-1)?.state||base,"Reference example-এর simulation শেষ।",[],"found","Result প্রস্তুত।","Simulated output",0,0,l.code.length-2)}codePosition=-1}
function updateCode(){if(!$("codeLines"))return;const t=trace[codePosition]||null;$("codeLines").querySelectorAll(".code-line").forEach(el=>el.classList.toggle("current",Number(el.dataset.line)===(t?.line??-1)));$("variables").textContent=t?`step = ${codePosition+1}\nactiveIndex = ${t.active.join(", ")||"—"}\ncomparisons = ${trace.slice(0,codePosition+1).reduce((n,x)=>n+x.compare,0)}\nchanges = ${trace.slice(0,codePosition+1).reduce((n,x)=>n+x.change,0)}\n${t.info}`:"Ready · press Run Animation";$("codeFrame").innerHTML=frame(t);$("codeOutput").textContent=t?codePosition===trace.length-1?`Simulated result: ${Array.isArray(t.state)?t.state.join(" "):t.state}`:"Simulation in progress…":"Simulation ready.";$("codeExplanation").textContent=t?`Line ${(t.line??0)+1}: ${t.message} ${t.why}`:"প্রতিটি highlighted line predefined trace-এর সাথে যুক্ত।"}
function codeMove(delta){if(!trace.length)codeSteps();codePosition=Math.max(-1,Math.min(trace.length-1,codePosition+delta));updateCode();if(codePosition===trace.length-1)stop()}
function run(which){if(playing){stop();return}if(which==="step"&&!trace.length){notify("আগে একটি operation বেছে নিন।");return}if(which==="code"&&!trace.length)codeSteps();if(which==="step"&&position>=trace.length-1)position=-1;if(which==="code"&&codePosition>=trace.length-1)codePosition=-1;mode=which;playing=true;updatePlayLabels();const tick=()=>{if(!playing)return;if(which==="step"){changePosition(position+1);if(position>=trace.length-1){stop();return}}else{codeMove(1);if(codePosition>=trace.length-1){stop();return}}timer=setTimeout(tick,store.reduced||reducedMedia.matches?80:Math.round(760/speed))};tick()}
function act(action,scope){try{prepare(action,scope);if(scope==="step")updateStep();else updateLab();if($("realFrame"))$("realFrame").innerHTML=frame(currentTrace(),true)}catch(e){notify(e.message);lastMessage=e.message;updateLab()}}
document.addEventListener("click",e=>{const button=e.target.closest("button");if(!button)return;
if(button.dataset.topic!==undefined){const i=Number(button.dataset.topic);if(i>=0&&i<N)openLesson(i);return}

if(button.dataset.tab){stop();tab=button.dataset.tab;render();return}
if(button.dataset.action){act(button.dataset.action,button.dataset.scope);return}
if(button.hasAttribute("data-continue")){openLesson(store.recent[0]??store.completed.findIndex((_,i)=>!store.completed.includes(i))>=0?store.recent[0]??0:0);return}
if(button.hasAttribute("data-complete")){store.completed=store.completed.includes(current)?store.completed.filter(i=>i!==current):[...store.completed,current];persist();nav();render();notify(store.completed.includes(current)?"Lesson completed!":"Lesson marked incomplete.");return}

switch(button.id){
case "menuBtn":{const opened=$("sidebar").classList.toggle("open");$("backdrop").classList.toggle("show",opened);button.setAttribute("aria-expanded",String(opened));break}
case "motionBtn":store.reduced=!store.reduced;document.body.classList.toggle("reduced",store.reduced);persist();notify(store.reduced?"Reduced motion on":"Reduced motion off");break;
case "answerBtn":$("practiceAnswer").classList.toggle("hidden");button.textContent=$("practiceAnswer").classList.contains("hidden")?"উত্তর দেখাও":"উত্তর লুকাও";break;
case "realAnimate":{if(!trace.length){const k=lessons[current].kind;const defaultAction={array:"traverse",address:"calculate",search:"find",basic:"sort",advanced:"sort",linked:"search",stack:"peek",queue:"peek",string:"length"}[k];try{prepare(defaultAction,"step")}catch{trace=[];snapshot(data,"বাস্তব উদাহরণ: element-গুলো একে একে দেখা হচ্ছে।",[],"active",lessons[current].real,"Scenario",0,0,lessons[current].line);position=-1}}tab="step";render();run("step");break}
case "realReset":resetTrace(true);break;
case "stepPlay":run("step");break;case "stepPause":stop();break;
case "stepPrev":stop();changePosition(position-1);break;
case "stepNext":stop();changePosition(position+1);break;
case "stepReset":resetTrace();break;
case "labReset":resetTrace(true);break;
case "codeRun":run("code");break;case "codePause":stop();break;
case "codeNext":stop();codeMove(1);break;
case "codePrev":stop();if(!trace.length)codeSteps();codeMove(-1);break;
case "codeReset":stop();trace=[];codePosition=-1;updateCode();break;
case "resetAll":if(!resetConfirm){resetConfirm=true;render()}else{store.completed=[];store.bookmarks=[];store.recent=[];resetConfirm=false;persist();nav();render();notify("Progress reset হয়েছে।")}break;
case "cancelReset":resetConfirm=false;render();break
}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-choice]");if(!b||quizLocked)return;quizLocked=true;const correct=lessons[current].quiz[5];$("quizChoices").querySelectorAll("[data-choice]").forEach(x=>{x.disabled=true;if(Number(x.dataset.choice)===correct)x.classList.add("correct");else if(x===b)x.classList.add("wrong")});$("quizFeedback").textContent=Number(b.dataset.choice)===correct?"সঠিক! দারুণ করেছেন।":"ভুল হয়েছে। সবুজ উত্তরটি দেখুন।"});
document.addEventListener("input",e=>{if(e.target.id==="globalSearch")filterNav();if(e.target.id==="stepTimeline"){stop();changePosition(Number(e.target.value)-1)}});
document.addEventListener("change",e=>{if(e.target.id==="stepSpeed"||e.target.id==="codeSpeed")speed=Number(e.target.value)});
